<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>化工装置变更与工艺安全管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; background: #f9fafb; }
    main { max-width: 1080px; margin: auto; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.4rem; }
    h1 { margin-bottom: .3rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    label { display: block; font-size: .85rem; color: #374151; margin: .5rem 0 .2rem; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: .45rem .55rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: .8rem; }
    .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
    button { padding: .5rem .9rem; cursor: pointer; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: .88rem; margin-top: .7rem; }
    button.secondary { background: #6b7280; }
    button.ghost { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; margin: 0; padding: .3rem .6rem; font-size: .78rem; }
    button.danger { background: #b91c1c; }
    pre { background: #0f172a; color: #e2e8f0; padding: .9rem; border-radius: 8px; overflow-x: auto; font-size: .78rem; max-height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { color: #6b7280; font-weight: 600; }
    .badge { display: inline-block; padding: .12rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .pending_review { background: #fef3c7; color: #92400e; }
    .active { background: #dcfce7; color: #166534; }
    .reconfirm_required { background: #fee2e2; color: #991b1b; }
    .recovered { background: #e0e7ff; color: #3730a3; }
    .invalidated { background: #e5e7eb; color: #374151; }
    .muted { color: #6b7280; font-size: .82rem; }
    .reasons span { display: inline-block; background: #fee2e2; color: #991b1b; border-radius: 4px; padding: .05rem .4rem; margin: .05rem; font-size: .74rem; }
    .blocker { border-left: 4px solid #b91c1c; background: #fef2f2; padding: .6rem .8rem; border-radius: 4px; margin: .4rem 0; font-size: .84rem; }
    .okbox { border-left: 4px solid #16a34a; background: #f0fdf4; padding: .6rem .8rem; border-radius: 4px; font-size: .84rem; }
  </style>
</head>
<body>
<main>
  <h1>化工装置变更与工艺安全管理</h1>
  <p class="muted">联锁旁路必须由<b>操作员</b>提出、<b>安全员</b>复核后方可生效；风险升级、装置停机或恢复责任人变更时需重新签认；到期或变更被拒绝 / 撤回 / 关闭时自动失效。</p>

  <section>
    <h2>请求身份</h2>
    <div class="row3">
      <div><label>用户 ID</label><input id="userId" value="op-1"></div>
      <div><label>角色</label>
        <select id="role">
          <option value="operator">operator 操作员</option>
          <option value="safety">safety 安全员</option>
          <option value="engineer">engineer 工程师</option>
          <option value="verifier">verifier 验证员</option>
          <option value="admin">admin 管理员</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;gap:.5rem;">
        <button class="secondary" onclick="refreshAll()">刷新全部</button>
        <button class="ghost" onclick="checkHealth()">健康检查</button>
      </div>
    </div>
  </section>

  <section>
    <h2>1. 提出联锁旁路</h2>
    <div class="row3">
      <div><label>所属变更</label><select id="bypassChange"></select></div>
      <div><label>装置</label><select id="bypassUnit"></select></div>
      <div><label>联锁位号</label><input id="bypassTag" placeholder="例如 I-1001"></div>
    </div>
    <div class="row3">
      <div><label>恢复期限（YYYY-MM-DD）</label><input id="bypassDeadline" type="date"></div>
      <div><label>恢复责任人</label><input id="bypassOwner" placeholder="责任人 ID"></div>
      <div style="display:flex;align-items:flex-end;"><button onclick="submitBypass()">提交旁路申请</button></div>
    </div>
    <p class="muted">提交后状态为「待复核」，需安全员执行复核才能生效。</p>
  </section>

  <section>
    <h2>2. 联锁旁路列表与操作</h2>
    <table>
      <thead>
        <tr><th>位号</th><th>装置 / 变更</th><th>状态</th><th>恢复期限</th><th>责任人</th><th>待重新签认原因</th><th>操作</th></tr>
      </thead>
      <tbody id="bypassRows"><tr><td colspan="7" class="muted">点击“刷新全部”加载</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>3. 投产阻塞项检查</h2>
    <div class="row">
      <div><label>变更</label><select id="blockerChange"></select></div>
      <div style="display:flex;align-items:flex-end;"><button class="secondary" onclick="checkBlockers()">检查阻塞项</button></div>
    </div>
    <div id="blockerResult" class="muted" style="margin-top:.7rem;">尚未检查。</div>
  </section>

  <section>
    <h2>最近操作结果</h2>
    <pre id="result">等待操作</pre>
  </section>
</main>
<script>
const STATUS_LABELS = {
  pending_review: '待复核', active: '生效中', reconfirm_required: '待重新签认',
  recovered: '已恢复', invalidated: '已失效',
  draft: '草稿', assessed: '已评估', approved: '已批准', implemented: '已实施',
  commissioned: '已投产', rolled_back: '已回退', rejected: '已拒绝',
  withdrawn: '已撤回', closed: '已关闭',
};
const REASON_LABELS = {
  risk_escalated: '变更风险升级', unit_shutdown: '装置停机',
  owner_changed: '恢复责任人更换',
};
let units = [], changes = [], bypasses = [];

function headers() {
  return {'Content-Type': 'application/json', 'X-User-Id': document.getElementById('userId').value, 'X-Role': document.getElementById('role').value};
}
function show(payload) {
  document.getElementById('result').textContent = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
}
async function checkHealth() {
  const res = await fetch('/health');
  show(await res.json());
}
async function api(method, path, body) {
  const res = await fetch(path, {method, headers: headers(), body: body ? JSON.stringify(body) : undefined});
  const value = await res.json();
  if (!res.ok) throw new Error((value.type || 'Error') + ': ' + value.error);
  return value;
}
function deadlineDefault() {
  const d = new Date(); d.setDate(d.getDate() + 7);
  return d.toISOString().slice(0, 10);
}
async function refreshAll() {
  units = await (await fetch('/api/units')).json().then(j => j.items);
  changes = await (await fetch('/api/changes')).json().then(j => j.items);
  bypasses = await (await fetch('/api/interlock_bypasses')).json().then(j => j.items);
  fillSelect('bypassUnit', units.map(u => [u.id, u.data.name + '（' + u.data.location + '）']));
  const openChanges = changes.filter(c => ['draft','assessed','approved','implemented'].includes(c.status));
  fillSelect('bypassChange', openChanges.map(c => [c.id, c.id.slice(0,8) + ' · ' + c.data.description]));
  fillSelect('blockerChange', changes.map(c => [c.id, c.id.slice(0,8) + ' · ' + STATUS_LABELS[c.status] + ' · ' + c.data.description]));
  renderBypasses();
  if (!document.getElementById('bypassDeadline').value) document.getElementById('bypassDeadline').value = deadlineDefault();
  show({units: units.length, changes: changes.length, interlock_bypasses: bypasses.length});
}
function fillSelect(id, pairs) {
  document.getElementById(id).innerHTML = pairs.map(([v, t]) => `<option value="${v}">${escapeHtml(t)}</option>`).join('');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderBypasses() {
  const tbody = document.getElementById('bypassRows');
  if (!bypasses.length) { tbody.innerHTML = '<tr><td colspan="7" class="muted">暂无旁路记录</td></tr>'; return; }
  tbody.innerHTML = bypasses.map(b => {
    const d = b.data;
    const reasons = (d.reconfirm_reasons || []).map(r => `<span>${REASON_LABELS[r] || r}</span>`).join('') || '<span class="muted">—</span>';
    const actions = [];
    if (b.status === 'pending_review') actions.push(`<button class="ghost" onclick="doAction('${b.id}','review',{review_note:prompt('复核意见：')})">安全员复核</button>`);
    if (b.status === 'reconfirm_required') actions.push(`<button class="ghost" onclick="doAction('${b.id}','reconfirm',{signoff_note:prompt('重新签认意见：')})">重新签认</button>`);
    if (b.status === 'active' || b.status === 'reconfirm_required') {
      actions.push(`<button class="ghost" onclick="doAction('${b.id}','reassign_owner',{recovery_owner:prompt('新的恢复责任人：')})">更换责任人</button>`);
      actions.push(`<button class="ghost" onclick="doAction('${b.id}','recover',{restored_by:document.getElementById('userId').value})">恢复联锁</button>`);
    }
    if (b.status === 'invalidated' || b.status === 'recovered') actions.push('<span class="muted">记录保留</span>');
    const unit = units.find(u => u.id === d.unit_id);
    return `<tr>
      <td>${escapeHtml(d.interlock_tag || '')}</td>
      <td>${escapeHtml(unit ? unit.data.name : d.unit_id)}<br><span class="muted">${escapeHtml(String(d.change_id || '').slice(0,8))}</span></td>
      <td><span class="badge ${b.status}">${STATUS_LABELS[b.status] || b.status}</span></td>
      <td>${escapeHtml(d.recovery_deadline || '')}</td>
      <td>${escapeHtml(d.recovery_owner || '')}</td>
      <td class="reasons">${reasons}</td>
      <td style="display:flex;gap:.3rem;flex-wrap:wrap;">${actions.join(' ')}</td>
    </tr>`;
  }).join('');
}
async function submitBypass() {
  const body = {
    change_id: document.getElementById('bypassChange').value,
    unit_id: document.getElementById('bypassUnit').value,
    interlock_tag: document.getElementById('bypassTag').value,
    recovery_deadline: document.getElementById('bypassDeadline').value,
    recovery_owner: document.getElementById('bypassOwner').value,
  };
  try { show(await api('POST', '/api/interlock_bypasses', body)); await refreshAll(); }
  catch (e) { show(String(e)); }
}
async function doAction(id, action, data) {
  if (Object.values(data).some(v => !v)) return;
  try {
    const entity = await api('POST', `/api/entities/${id}/actions`, {action, data, expected_version: null});
    show(entity); await refreshAll();
  } catch (e) { show(String(e)); }
}
async function checkBlockers() {
  const id = document.getElementById('blockerChange').value;
  try {
    const result = await (await fetch(`/api/entities/${id}/blockers`)).json();
    const box = document.getElementById('blockerResult');
    if (!result.blockers.length) {
      box.className = 'okbox'; box.textContent = '无阻塞项，可以请求投产。';
    } else {
      box.className = '';
      box.innerHTML = result.blockers.map(b => {
        if (b.type === 'interlock_bypass') {
          const detail = b.detail || {};
          const extra = detail.invalid_reason ? `（失效原因：${detail.invalid_reason}）` :
            (detail.reconfirm_reasons || []).map(r => REASON_LABELS[r] || r).join('、');
          return `<div class="blocker">联锁旁路 <b>${escapeHtml(b.id.slice(0,8))}</b> / 位号 <b>${escapeHtml(detail.interlock_tag || '')}</b>：${reasonText(b.reason)}，恢复期限 ${escapeHtml(detail.recovery_deadline || '')} ${escapeHtml(extra)}</div>`;
        }
        return `<div class="blocker">行动项 <b>${escapeHtml(b.id.slice(0,8))}</b>：${reasonText(b.reason)}</div>`;
      }).join('');
    }
    show(result);
  } catch (e) { show(String(e)); }
}
function reasonText(reason) {
  return {
    bypass_pending_review: '尚未经安全员复核',
    bypass_active: '旁路仍生效、联锁未恢复',
    bypass_reconfirm_required: '触发条件变化后尚未重新签认',
    bypass_invalidated: '旁路已失效但联锁未确认恢复',
    action_item_unverified: '风险控制行动项未验证关闭',
  }[reason] || reason;
}
refreshAll();
</script>
</body>
</html>
